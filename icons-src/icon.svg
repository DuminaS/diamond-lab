<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="roundedBg">
      <rect width="512" height="512" rx="96" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBg)">
    <rect width="512" height="512" fill="#12181B" />
  </g>

  <!-- Baseball: gold ball body with dark seam channels and red stitch marks -->
  <g transform="translate(256,256)">
    <circle r="150" fill="#D4AF37" />

    <!-- Left seam -->
    <path d="M -104,-108 C -150,-58 -150,58 -104,108" fill="none" stroke="#12181B" stroke-width="14" stroke-linecap="round" />
    <!-- Right seam -->
    <path d="M 104,-108 C 150,-58 150,58 104,108" fill="none" stroke="#12181B" stroke-width="14" stroke-linecap="round" />

    <!-- Stitch marks along both seams -->
    <g stroke="#B4232A" stroke-width="9" stroke-linecap="round">
      <path d="M -128,-78 l 26,10 M -140,-40 l 27,7 M -142,0 l 28,0 M -140,40 l 27,-7 M -128,78 l 26,-10" />
      <path d="M 128,-78 l -26,10 M 140,-40 l -27,7 M 142,0 l -28,0 M 140,40 l -27,-7 M 128,78 l -26,-10" />
    </g>
  </g>
</svg>

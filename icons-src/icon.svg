<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="roundedBg">
      <rect width="512" height="512" rx="96" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundedBg)">
    <rect width="512" height="512" fill="#12181B" />
  </g>

  <g transform="translate(256,256) rotate(-22)">
    <!-- Solid football silhouette, sharpened tips -->
    <path d="M -158,0
             C -158,-48 -72,-86 0,-86
             C 72,-86 158,-48 158,0
             C 158,48 72,86 0,86
             C -72,86 -158,48 -158,0 Z"
          fill="#D4AF37" />

    <!-- Seam + laces cut out of the gold shape as flat negative space, like the reference -->
    <rect x="-78" y="-7" width="156" height="14" rx="6" fill="#12181B" />
    <rect x="-58" y="-19" width="12" height="38" rx="3" fill="#12181B" />
    <rect x="-32" y="-19" width="12" height="38" rx="3" fill="#12181B" />
    <rect x="-6"  y="-19" width="12" height="38" rx="3" fill="#12181B" />
    <rect x="20"  y="-19" width="12" height="38" rx="3" fill="#12181B" />
    <rect x="46"  y="-19" width="12" height="38" rx="3" fill="#12181B" />
  </g>
</svg>
